<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Avaliação de Atendimento</title>
  </head>
  <style>
    :root {
      --font: system-ui, "Segoe UI", Roboto, sans-serif;
      --radius: 1rem;
      --radius-lg: 1.25rem;
      --transition: 0.22s cubic-bezier(0.33, 1, 0.68, 1);
      --shadow-hover: 0 10px 28px rgba(0, 0, 0, 0.18);
      --bad: #dc2626;
      --bad-dim: #991b1b;
      --mid: #ca8a04;
      --mid-dim: #a16207;
      --good: #16a34a;
      --good-dim: #15803d;
      --send: #2563eb;
      --send-dim: #1d4ed8;
      --surface: #f8fafc;
      --text: #0f172a;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font);
      color: var(--text);
      background: radial-gradient(
          ellipse 120% 80% at 50% -20%,
          rgba(37, 99, 235, 0.08),
          transparent 55%
        ),
        var(--surface);
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100% - 1.5rem, 36rem);
      margin-inline: auto;
      padding: clamp(1.25rem, 4vw, 2rem);
    }

    section:first-of-type {
      display: flex;
      flex-direction: column;
      gap: clamp(0.75rem, 3vw, 1rem);
    }

    h2 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.15rem, 4vw, 1.45rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    /* Base dos botões: toque generoso + hover elegante */
    button {
      font: inherit;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      min-height: 2.75rem;
      font-weight: 600;
      font-size: clamp(0.95rem, 2.8vw, 1.05rem);
      transition: transform var(--transition), box-shadow var(--transition),
        filter var(--transition), background-color var(--transition),
        border-color var(--transition), color var(--transition);
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(0.94);
      box-shadow: var(--shadow-hover), 0 0 0 1px rgba(255, 255, 255, 0.12) inset;
    }

    button:active {
      transform: translateY(0);
      filter: brightness(0.88);
      transition-duration: 0.08s;
    }

    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.45), var(--shadow-hover);
    }

    /* Cores temáticas por nota */
    #pessimo {
      background: linear-gradient(165deg, #fee2e2, #fecaca);
      color: var(--bad-dim);
      border-color: rgba(220, 38, 38, 0.35);
    }

    #pessimo:hover {
      box-shadow: var(--shadow-hover), 0 0 24px rgba(220, 38, 38, 0.35);
    }

    #regular {
      background: linear-gradient(165deg, #fef9c3, #fef08a);
      color: var(--mid-dim);
      border-color: rgba(202, 138, 12, 0.4);
    }

    #regular:hover {
      box-shadow: var(--shadow-hover), 0 0 24px rgba(234, 179, 8, 0.4);
    }

    #excelente {
      background: linear-gradient(165deg, #dcfce7, #bbf7d0);
      color: var(--good-dim);
      border-color: rgba(22, 163, 74, 0.35);
    }

    #excelente:hover {
      box-shadow: var(--shadow-hover), 0 0 24px rgba(22, 163, 74, 0.35);
    }

    /* Enviar: cor padrão + muda conforme qual nota está em destaque (:has) */
    #enviar-avaliacao {
      margin-top: 0.35rem;
      background: linear-gradient(165deg, #60a5fa, var(--send));
      color: #fff;
      border-color: rgba(255, 255, 255, 0.25);
    }

    #enviar-avaliacao:hover {
      box-shadow: var(--shadow-hover), 0 0 26px rgba(37, 99, 235, 0.45);
    }

    section:has(#pessimo.destaque) #enviar-avaliacao {
      background: linear-gradient(165deg, #f87171, var(--bad));
      border-color: rgba(255, 255, 255, 0.2);
    }

    section:has(#pessimo.destaque) #enviar-avaliacao:hover {
      box-shadow: var(--shadow-hover), 0 0 26px rgba(220, 38, 38, 0.45);
    }

    section:has(#regular.destaque) #enviar-avaliacao {
      background: linear-gradient(165deg, #facc15, var(--mid));
      color: #422006;
      border-color: rgba(0, 0, 0, 0.08);
    }

    section:has(#regular.destaque) #enviar-avaliacao:hover {
      box-shadow: var(--shadow-hover), 0 0 26px rgba(202, 138, 12, 0.5);
    }

    section:has(#excelente.destaque) #enviar-avaliacao {
      background: linear-gradient(165deg, #4ade80, var(--good));
      border-color: rgba(255, 255, 255, 0.22);
    }

    section:has(#excelente.destaque) #enviar-avaliacao:hover {
      box-shadow: var(--shadow-hover), 0 0 26px rgba(22, 163, 74, 0.45);
    }

    /* Destaque após envio (seu JS adiciona .destaque): leve scale + fade + pulso curto */
    .destaque {
      position: relative;
      color: #fff !important;
      border-width: 2px;
      border-color: rgba(255, 255, 255, 0.55) !important;
      /* Um único @keyframes evita conflito de transform entre duas animações */
      animation: destaque-pop 0.42s cubic-bezier(0.34, 1.35, 0.64, 1) both;
    }

    #pessimo.destaque {
      background: linear-gradient(165deg, #ef4444, var(--bad-dim)) !important;
      box-shadow: 0 8px 28px rgba(220, 38, 38, 0.45);
    }

    #regular.destaque {
      background: linear-gradient(165deg, #eab308, var(--mid-dim)) !important;
      color: #1c1917 !important;
      box-shadow: 0 8px 28px rgba(202, 138, 12, 0.45);
    }

    #excelente.destaque {
      background: linear-gradient(165deg, #22c55e, var(--good-dim)) !important;
      box-shadow: 0 8px 28px rgba(22, 163, 74, 0.45);
    }

    @keyframes destaque-pop {
      0% {
        opacity: 0.72;
        transform: scale(0.96);
      }
      35% {
        opacity: 1;
        transform: scale(1.05);
      }
      55% {
        transform: scale(0.99);
      }
      75% {
        transform: scale(1.03);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Toast lateral: sobe suavemente; some quando #mensagem fica vazio (seu setTimeout) */
    #mensagem {
      position: fixed;
      right: clamp(0.75rem, 3vw, 1.5rem);
      bottom: clamp(0.75rem, 3vw, 1.5rem);
      left: auto;
      max-width: min(22rem, calc(100vw - 1.5rem));
      z-index: 1000;
      margin: 0;
      padding: 0;
      pointer-events: none;
      border-radius: var(--radius-lg);
      min-height: 0;
      opacity: 0;
      transform: translateY(120%);
      transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #mensagem:not(:empty) {
      pointer-events: auto;
      opacity: 1;
      transform: translateY(0);
      padding: 1rem 1.15rem;
      font-size: 0.95rem;
      line-height: 1.45;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    #mensagem.erro:not(:empty) {
      background: linear-gradient(155deg, #fef2f2, #fee2e2);
      color: #991b1b;
      border-color: rgba(220, 38, 38, 0.25);
    }

    #mensagem.sucesso:not(:empty) {
      background: linear-gradient(155deg, #f0fdf4, #dcfce7);
      color: #166534;
      border-color: rgba(22, 163, 74, 0.25);
    }

    #mensagem strong {
      display: inline;
      font-size: inherit;
      font-weight: 800;
    }

    #mensagem.erro:not(:empty) strong {
      color: #b91c1c;
    }

    #mensagem.sucesso:not(:empty) strong {
      color: var(--good-dim);
    }

    /* Mobile: botões grandes, emoji maior, mais ar */
    @media (max-width: 540px) {
      button {
        min-height: 3.25rem;
        padding: 1rem 1.15rem;
        border-radius: var(--radius-lg);
        font-size: 1.08rem;
      }

      button:first-of-type {
        margin-top: 0.15rem;
      }

      #pessimo,
      #regular,
      #excelente,
      #enviar-avaliacao {
        font-size: 1.12rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      button:hover {
        transform: none;
      }

      #mensagem:not(:empty) {
        transform: none;
      }
    }
  </style>
  <body>
    <main>
      <section class="avaliacao">
        <h2>Como você avalia nosso atentimento?</h2>
        <button id="pessimo">😡 Péssimo</button>
        <button id="regular">😐 Regular</button>
        <button id="excelente">😄 Excelente</button>
        <button id="enviar-avaliacao">Enviar Avaliação</button>
      </section>
      <section>
        <div id="mensagem"></div>
      </section>
    </main>

    <script>
      const btnPessimo = document.getElementById("pessimo");
      const btnRegular = document.getElementById("regular");
      const btnExcelente = document.getElementById("excelente");
      const btnEnviarAvaliacao = document.getElementById("enviar-avaliacao");
      const mensagem = document.getElementById("mensagem");
      let avaliacaoSelecionada = null;

      btnPessimo.addEventListener("click", () => {
        selecionarAvaliacao("pessimo");
      });
      btnRegular.addEventListener("click", () => {
        selecionarAvaliacao("regular");
      });
      btnExcelente.addEventListener("click", () => {
        selecionarAvaliacao("excelente");
      });
      btnEnviarAvaliacao.addEventListener("click", () => {
        enviarAvaliacao();
      });

      function selecionarAvaliacao(valor) {
        avaliacaoSelecionada = valor;
      }

      function enviarAvaliacao() {
        if (avaliacaoSelecionada === null)
          return mostrarMensagem(
            "erro",
            "Selecione uma opção antes de enviar a sua avaliação!",
          );

        mostrarMensagem(
          "sucesso",
          `Obrigado, a sua opinião foi registrada!
        A sua avaliação foi de <strong>${avaliacaoSelecionada}</strong> pelo nosso atendimento.`,
        );

        btnPessimo.classList.remove("destaque");
        btnRegular.classList.remove("destaque");
        btnExcelente.classList.remove("destaque");

        switch (avaliacaoSelecionada) {
          case "pessimo":
            btnPessimo.classList.add("destaque");
            break;
          case "regular":
            btnRegular.classList.add("destaque");
            break;
          case "excelente":
            btnExcelente.classList.add("destaque");
            break;
          default:
            mostrarMensagem(
              "erro",
              "Nenhum botão de avaliação foi selecionado.",
            );
        }
      }

      function mostrarMensagem(tipo, texto) {
        mensagem.classList.remove("erro");
        mensagem.classList.remove("sucesso");
        mensagem.innerHTML = "";

        if (tipo === "erro") {
          mensagem.innerHTML = texto;
          mensagem.classList.add("erro");
        } else {
          mensagem.innerHTML = texto;
          mensagem.classList.add("sucesso");
        }

        setTimeout(() => {
          mensagem.innerHTML = "";
        }, 3500);
      }
    </script>
  </body>
</html>
