<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Avaliação de Atendimento</title>
  </head>
  <style>
    :root {
      --font: system-ui, "Segoe UI", Roboto, sans-serif;
      --radius: 1rem;
      --radius-lg: 1.25rem;
      --transition: 0.22s cubic-bezier(0.33, 1, 0.68, 1);
      --shadow-hover: 0 10px 28px rgba(0, 0, 0, 0.18);
      --bad: #dc2626;
      --bad-dim: #991b1b;
      --mid: #ca8a04;
      --mid-dim: #a16207;
      --good: #16a34a;
      --good-dim: #15803d;
      --send: #2563eb;
      --send-dim: #1d4ed8;
      --surface: #f8fafc;
      --text: #0f172a;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font);
      color: var(--text);
      background:
        /* Gradiente principal mais visível */
        radial-gradient(
          circle at 20% 80%,
          rgba(37, 99, 235, 0.3),
          transparent 50%
        ),
        radial-gradient(
          circle at 80% 20%,
          rgba(16, 163, 74, 0.25),
          transparent 50%
        ),
        radial-gradient(
          circle at 50% 50%,
          rgba(202, 138, 12, 0.15),
          transparent 60%
        ),
        /* Gradiente base */
        linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100% - 1.5rem, 36rem);
      margin-inline: auto;
      padding: clamp(1.25rem, 4vw, 2rem);
    }

    section:first-of-type {
      display: flex;
      flex-direction: column;
      gap: clamp(0.75rem, 3vw, 1rem);
    }

    h2 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.15rem, 4vw, 1.45rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    /* Base dos botões: toque generoso + hover elegante */
    button {
      font: inherit;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      min-height: 2.75rem;
      font-weight: 600;
      font-size: clamp(0.95rem, 2.8vw, 1.05rem);
      transition:
        transform var(--transition),
        box-shadow var(--transition),
        filter var(--transition),
        background-color var(--transition),
        border-color var(--transition),
        color var(--transition);
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(0.94);
      box-shadow:
        var(--shadow-hover),
        0 0 0 1px rgba(255, 255, 255, 0.12) inset;
    }

    button:active {
      transform: translateY(0);
      filter: brightness(0.88);
      transition-duration: 0.08s;
    }

    button:focus-visible {
      outline: none;
      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.45),
        var(--shadow-hover);
    }

    /* Cores temáticas por nota */
    #pessimo {
      background: linear-gradient(165deg, #fee2e2, #fecaca);
      color: var(--bad-dim);
      border-color: rgba(220, 38, 38, 0.35);
    }

    #pessimo:hover {
      box-shadow:
        var(--shadow-hover),
        0 0 24px rgba(220, 38, 38, 0.35);
    }

    #regular {
      background: linear-gradient(165deg, #fef9c3, #fef08a);
      color: var(--mid-dim);
      border-color: rgba(202, 138, 12, 0.4);
    }

    #regular:hover {
      box-shadow:
        var(--shadow-hover),
        0 0 24px rgba(234, 179, 8, 0.4);
    }

    #excelente {
      background: linear-gradient(165deg, #dcfce7, #bbf7d0);
      color: var(--good-dim);
      border-color: rgba(22, 163, 74, 0.35);
    }

    #excelente:hover {
      box-shadow:
        var(--shadow-hover),
        0 0 24px rgba(22, 163, 74, 0.35);
    }

    /* Enviar: cor padrão + muda conforme qual nota está em destaque (:has) */
    #enviar-avaliacao {
      margin-top: 0.35rem;
      background: linear-gradient(165deg, #60a5fa, var(--send));
      color: #fff;
      border-color: rgba(255, 255, 255, 0.25);
    }

    #enviar-avaliacao:hover {
      box-shadow:
        var(--shadow-hover),
        0 0 26px rgba(37, 99, 235, 0.45);
    }

    section:has(#pessimo.destaque) #enviar-avaliacao {
      background: linear-gradient(165deg, #f87171, var(--bad));
      border-color: rgba(255, 255, 255, 0.2);
    }

    section:has(#pessimo.destaque) #enviar-avaliacao:hover {
      box-shadow:
        var(--shadow-hover),
        0 0 26px rgba(220, 38, 38, 0.45);
    }

    section:has(#regular.destaque) #enviar-avaliacao {
      background: linear-gradient(165deg, #facc15, var(--mid));
      color: #422006;
      border-color: rgba(0, 0, 0, 0.08);
    }

    section:has(#regular.destaque) #enviar-avaliacao:hover {
      box-shadow:
        var(--shadow-hover),
        0 0 26px rgba(202, 138, 12, 0.5);
    }

    section:has(#excelente.destaque) #enviar-avaliacao {
      background: linear-gradient(165deg, #4ade80, var(--good));
      border-color: rgba(255, 255, 255, 0.22);
    }

    section:has(#excelente.destaque) #enviar-avaliacao:hover {
      box-shadow:
        var(--shadow-hover),
        0 0 26px rgba(22, 163, 74, 0.45);
    }

    /* Estilo do botão desabilitado (classe botao-clicado) */
    #enviar-avaliacao.botao-clicado {
      background: linear-gradient(165deg, #94a3b8, #64748b) !important;
      color: #cbd5e1 !important;
      border-color: rgba(255, 255, 255, 0.1) !important;
      opacity: 0.7;
      cursor: not-allowed;
      transform: none !important;
      filter: none !important;
      box-shadow: none !important;
    }

    #enviar-avaliacao.botao-clicado:hover {
      transform: none !important;
      filter: none !important;
      box-shadow: none !important;
    }

    /* Destaque após envio (seu JS adiciona .destaque): leve scale + fade + pulso curto */
    .destaque {
      position: relative;
      color: #fff !important;
      border-width: 2px;
      border-color: rgba(255, 255, 255, 0.55) !important;
      /* Um único @keyframes evita conflito de transform entre duas animações */
      animation: destaque-pop 0.42s cubic-bezier(0.34, 1.35, 0.64, 1) both;
    }

    #pessimo.destaque {
      background: linear-gradient(165deg, #ef4444, var(--bad-dim)) !important;
      box-shadow: 0 8px 28px rgba(220, 38, 38, 0.45);
    }

    #regular.destaque {
      background: linear-gradient(165deg, #eab308, var(--mid-dim)) !important;
      color: #1c1917 !important;
      box-shadow: 0 8px 28px rgba(202, 138, 12, 0.45);
    }

    #excelente.destaque {
      background: linear-gradient(165deg, #22c55e, var(--good-dim)) !important;
      box-shadow: 0 8px 28px rgba(22, 163, 74, 0.45);
    }

    /* Confetti/Emojis animados para o botão Excelente no envio */
    body.excelente-enviado .confetti-container::after {
      content: "⭐✨🎉💫🌟";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.5rem;
      font-weight: normal;
      pointer-events: none;
      z-index: 1000;
      white-space: nowrap;
      animation: confetti-queda 2s ease-in forwards;
    }

    /* Animações individuais para cada emoji - estilo queda */
    body.excelente-enviado .confetti-container::after {
      text-shadow:
        -30px -40px 0 ⭐,
        0 -35px 0 ✨,
        30px -38px 0 🎉,
        -25px -30px 0 💫,
        15px -32px 0 🌟,
        -15px -36px 0 ⭐,
        35px -34px 0 ✨,
        -35px -33px 0 🎉;
    }

    @keyframes confetti-queda {
      0% {
        opacity: 0;
        transform: translate(-50%, -150%);
      }
      20% {
        opacity: 1;
        transform: translate(-50%, -100%);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%);
      }
      80% {
        opacity: 0.8;
        transform: translate(-50%, 0%);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, 50%);
      }
    }

    .selecionado {
      outline: none;
      transform: scale(1.03);
      filter: brightness(1.12);
      box-shadow:
        0 0 20px rgba(0, 0, 0, 0.25),
        0 0 0 3px rgba(0, 0, 0, 0.25) inset;
      border-color: rgba(255, 255, 255, 0.65) !important;
    }

    @keyframes destaque-pop {
      0% {
        opacity: 0.72;
        transform: scale(0.96);
      }
      35% {
        opacity: 1;
        transform: scale(1.05);
      }
      55% {
        transform: scale(0.99);
      }
      75% {
        transform: scale(1.03);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Mobile: botões grandes, emoji maior, mais ar */
    @media (max-width: 540px) {
      button {
        min-height: 3.25rem;
        padding: 1rem 1.15rem;
        border-radius: var(--radius-lg);
        font-size: 1.08rem;
      }

      button:first-of-type {
        margin-top: 0.15rem;
      }

      #pessimo,
      #regular,
      #excelente,
      #enviar-avaliacao {
        font-size: 1.12rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      button:hover {
        transform: none;
      }

      #mensagem:not(:empty) {
        transform: none;
      }
    }

    /* ===================== */
    /* TOAST MODERNO PREMIUM */
    /* ===================== */

    #mensagem {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 400px;

      padding: 18px 20px;
      border-radius: 16px;

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      background: rgba(15, 23, 42, 0.82); /* slate-900 com transparência */
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);

      color: #fff;
      font-family: var(--font);
      opacity: 0;
      transform: translateY(20px) scale(0.95);
      pointer-events: none;

      transition:
        opacity 0.35s ease,
        transform 0.35s cubic-bezier(0.16, 0.85, 0.45, 1);
    }

    /* Layout interno */
    #mensagem .titulo {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      margin-bottom: 4px;
    }

    #mensagem .texto {
      font-size: 0.95rem;
      opacity: 0.92;
      margin-bottom: 6px;
    }

    #mensagem .contador {
      font-size: 0.8rem;
      opacity: 0.75;
      margin-top: 6px;

      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding-top: 6px;
    }

    /* Sucesso */
    #mensagem.sucesso {
      background: linear-gradient(
        135deg,
        rgba(34, 197, 94, 0.85),
        rgba(22, 163, 74, 0.85)
      );
    }

    /* Erro */
    #mensagem.erro {
      background: linear-gradient(
        135deg,
        rgba(239, 68, 68, 0.88),
        rgba(220, 38, 38, 0.88)
      );
    }

    /* Entrada */
    #mensagem.toast-visivel {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Saída */
    #mensagem.toast-saindo {
      opacity: 0;
      transform: translateY(20px) scale(0.95);
    }

    /* Animação extra: leve brilho ao aparecer */
    #mensagem.toast-visivel::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 22px rgba(255, 255, 255, 0.08);
      pointer-events: none;
      animation: glowIn 0.6s ease forwards;
    }

    @keyframes glowIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>
  <body>
    <main>
      <section class="avaliacao">
        <h2>Como você avalia nosso atentimento?</h2>
        <button id="pessimo">😡 Péssimo</button>
        <button id="regular">😐 Regular</button>
        <button id="excelente">😄 Excelente</button>
        <button id="enviar-avaliacao">Enviar Avaliação</button>
      </section>
      <section>
        <div id="mensagem" aria-live="polite"></div>
        <div class="confetti-container"></div>
      </section>
    </main>

    <script>
      const btnPessimo = document.getElementById("pessimo");
      const btnRegular = document.getElementById("regular");
      const btnExcelente = document.getElementById("excelente");
      const btnEnviarAvaliacao = document.getElementById("enviar-avaliacao");
      const mensagem = document.getElementById("mensagem");

      let avaliacaoSelecionada = null;
      let intervalContador = 0;
      let timeoutAnimacao = 0;

      btnPessimo.addEventListener("click", () => {
        selecionarAvaliacao("pessimo");
      });
      btnRegular.addEventListener("click", () => {
        selecionarAvaliacao("regular");
      });
      btnExcelente.addEventListener("click", () => {
        selecionarAvaliacao("excelente");
      });
      btnEnviarAvaliacao.addEventListener("click", () => {
        enviarAvaliacao();
      });

      function selecionarAvaliacao(valor) {
        avaliacaoSelecionada = valor;
        localStorage.setItem("avaliacao", valor);

        btnPessimo.classList.remove("destaque");
        btnRegular.classList.remove("destaque");
        btnExcelente.classList.remove("destaque");

        btnPessimo.classList.remove("selecionado");
        btnRegular.classList.remove("selecionado");
        btnExcelente.classList.remove("selecionado");

        switch (avaliacaoSelecionada) {
          case "pessimo":
            btnPessimo.classList.add("selecionado");
            break;
          case "regular":
            btnRegular.classList.add("selecionado");
            break;
          case "excelente":
            btnExcelente.classList.add("selecionado");
            break;
        }
      }

      function enviarAvaliacao() {
        btnEnviarAvaliacao.disabled = true;
        btnEnviarAvaliacao.classList.add("botao-clicado");

        if (avaliacaoSelecionada === null) {
          mostrarMensagem("erro", "Selecione uma opção antes de enviar.");

          setTimeout(() => {
            btnEnviarAvaliacao.disabled = false;
            btnEnviarAvaliacao.classList.remove("botao-clicado");
          }, 1800);

          return;
        }

        if (avaliacaoSelecionada === "excelente") {
          criarConfettiAleatorio();
        }

        mostrarMensagem(
          "sucesso",
          `Obrigado! Registramos sua opinião: <strong> ${avaliacaoSelecionada} </strong>`,
        );

        btnPessimo.classList.remove("selecionado", "destaque");
        btnRegular.classList.remove("selecionado", "destaque");
        btnExcelente.classList.remove("selecionado", "destaque");

        switch (avaliacaoSelecionada) {
          case "pessimo":
            btnPessimo.classList.add("destaque");
            break;
          case "regular":
            btnRegular.classList.add("destaque");
            break;
          case "excelente":
            btnExcelente.classList.add("destaque");
            break;
        }

        setTimeout(() => {
          btnEnviarAvaliacao.disabled = false;
          btnEnviarAvaliacao.classList.remove("botao-clicado");
        }, 5000);
      }

      function mostrarMensagem(tipo, texto) {
        clearInterval(intervalContador);
        clearTimeout(timeoutAnimacao);

        mensagem.classList.remove(
          "erro",
          "sucesso",
          "toast-visivel",
          "toast-saindo",
        );
        mensagem.innerHTML = "";

        const titulo =
          tipo === "sucesso"
            ? "✔️ Avaliação enviada!"
            : "❌ Oops! Algo deu errado";

        mensagem.classList.add(tipo);
        mensagem.classList.add("toast-visivel");

        let contador = 5;

        mensagem.innerHTML = `
          <div class="titulo">${titulo}</div>
          <div class="texto">${texto}</div>
          <div class="contador"> <small> Fechando em ${contador}...</small> </div>
        `;

        const contadorDiv = mensagem.querySelector(".contador");

        intervalContador = setInterval(() => {
          contador--;
          contadorDiv.innerHTML = `<small> Fechando em ${contador}...</small>`;

          if (contador === 0) {
            clearInterval(intervalContador);
            iniciarSaidaToast();
          }
        }, 1000);
      }

      function iniciarSaidaToast() {
        mensagem.classList.add("toast-saindo");

        timeoutAnimacao = setTimeout(() => {
          mensagem.classList.remove("toast-visivel", "toast-saindo");
          mensagem.innerHTML = "";
        }, 420);
      }

      function criarConfettiAleatorio() {
        const emojis = ["⭐", "✨", "🎉", "💫", "🌟", "🎊", "🌈", "⚡"];

        const quantidade = 15;

        for (let i = 0; i < quantidade; i++) {
          criarConfettiIndividual(emojis);
        }
      }

      function criarConfettiIndividual(emojis) {
        const confetti = document.createElement("div");

        const emojiAleatorio =
          emojis[Math.floor(Math.random() * emojis.length)];
        confetti.textContent = emojiAleatorio;

        const posicaoX = Math.random() * 100;
        confetti.style.left = posicaoX + "%";

        confetti.style.position = "fixed";
        confetti.style.top = "-50px";
        confetti.style.fontSize = Math.random() * 1 + 1 + "rem";
        confetti.style.zIndex = "1000";
        confetti.style.pointerEvents = "none";

        document.body.appendChild(confetti);

        setTimeout(() => {
          const duracao = Math.random() * 2 + 2;
          confetti.style.transition = `all ${duracao}s ease-in`;
          confetti.style.top = "110vh";
          confetti.style.opacity = "0";
          confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
        }, 200);

        setTimeout(() => {
          confetti.remove();
        }, 3500);
      }

      function avaliacaoSalva() {
        const salvo = localStorage.getItem("avaliacao");

        if (salvo) {
          avaliacaoSelecionada = salvo;
          switch (avaliacaoSelecionada) {
            case "pessimo":
              btnPessimo.classList.add("selecionado");
              break;
            case "regular":
              btnRegular.classList.add("selecionado");
              break;
            case "excelente":
              btnExcelente.classList.add("selecionado");
              break;
          }

          mostrarMensagem("sucesso", `Sua avaliação anterior foi de: ${avaliacaoSelecionada}`);
        }
      }

      avaliacaoSalva();
    </script>
  </body>
</html>
